# Base stack. Coolify deploys this file as-is (its proxy handles the domain and TLS,
# so no host ports are published here). For local use, docker-compose.override.yml
# is picked up automatically and publishes the app on HTTP_PORT.
services:
  db:
    # The database version is a setting, not a code change, because moving to a
    # newer one is one-way: once 8.4 has opened the data, 8.0 cannot read it
    # again. Leave it unset until a backup has been restored successfully
    # somewhere else, then set MYSQL_VERSION=8.4 (AGENTS.md, change log).
    image: mysql:${MYSQL_VERSION:-8.0}
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --sql-mode=
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-salisberg}
      MYSQL_USER: ${MYSQL_USER:-salisberg}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-https://salisberg.com}
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-salisberg}
      DB_USER: ${MYSQL_USER:-salisberg}
      DB_PASSWORD: ${MYSQL_PASSWORD:?}
      AUTO_INSTALL: ${AUTO_INSTALL:-1}
      ADMIN_DIR: ${ADMIN_DIR:-admin-salisberg}
      SYNC_DOMAIN: ${SYNC_DOMAIN:-1}
      SHOP_NAME: ${SHOP_NAME:-Salisberg Hotels}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      ADMIN_FIRSTNAME: ${ADMIN_FIRSTNAME:-Admin}
      ADMIN_LASTNAME: ${ADMIN_LASTNAME:-Salisberg}
      SHOP_COUNTRY: ${SHOP_COUNTRY:-us}
      TIMEZONE: ${TIMEZONE:-UTC}
    expose:
      - "80"
    volumes:
      - app_data:/data
      - app_img:/var/www/html/img
      - app_upload:/var/www/html/upload
      - app_download:/var/www/html/download

  # Nightly encrypted database + settings backup into the db_backups volume.
  # Uses the app image, which already has the MySQL client and openssl.
  backup:
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    restart: unless-stopped
    entrypoint: ["salisberg-backup"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-salisberg}
      DB_USER: ${MYSQL_USER:-salisberg}
      DB_PASSWORD: ${MYSQL_PASSWORD:?}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
    volumes:
      - db_backups:/backups
      - app_data:/data:ro

volumes:
  db_backups:
  db_data:
  app_data:
  app_img:
  app_upload:
  app_download:
