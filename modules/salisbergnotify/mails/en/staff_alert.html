<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<title>{shop_name}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3efe6;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
	<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3efe6;">
		<tr>
			<td align="center" style="padding:24px 12px;">
				<table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background-color:#ffffff;border:1px solid #d9d4c7;">
					<tr>
						<td align="center" style="padding:24px 24px 16px;border-bottom:3px solid #12352c;">
							<img src="{shop_logo}" alt="{shop_name}" style="max-width:200px;height:auto;" />
						</td>
					</tr>
					<tr>
						<td style="padding:24px;">
							<p style="margin:0 0 12px;font-size:18px;color:#12352c;font-weight:bold;">Staff alert</p>
							<p style="margin:0 0 16px;font-size:15px;line-height:24px;">{message}</p>
							<p style="margin:0;font-size:12px;line-height:20px;color:#6b7280;">You are receiving this because you are set as a booking-alert recipient in the back office. To stop these, ask a developer-team member to remove you under Administration &rsaquo; Integrations.</p>
						</td>
					</tr>
					<tr>
						<td align="center" style="padding:16px 24px 24px;border-top:1px solid #d9d4c7;font-size:12px;color:#6b7280;">
							{shop_name}
						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</body>
</html>
