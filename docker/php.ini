memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 20M
max_execution_time = 500
allow_url_fopen = On
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = UTC
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
; Request limiter for sign-in, password reset, contact and similar forms
auto_prepend_file = /usr/local/share/salisberg/ratelimit.php
