ServerTokens Prod
ServerSignature Off
# Trust X-Forwarded-* from the reverse proxy on the compose network
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>
ServerName localhost

# --- Hardening ---
# Hide the platform banner the application adds to every response
Header always unset Powered-By
Header unset Powered-By
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
# Only meaningful over HTTPS; the proxy tells us via X-Forwarded-Proto
Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"

# Content-Security-Policy, deliberately limited to rules the platform cannot
# trip over: no plugins, no <base> hijacking, no framing by other sites. A
# script-src rule is not set because the theme and back office rely on inline
# scripts; adding one needs a report-only trial first.
Header always set Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"
Header always set Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" "expr=%{HTTP:X-Forwarded-Proto} != 'https'"

# Folders that receive uploads must never run scripts, whatever lands in them
<DirectoryMatch "^(/var/www/html/(img|upload|download|modules/[^/]+/views/img)|/data)(/|$)">
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|pht|cgi|pl|py|sh)$">
        Require all denied
    </FilesMatch>
    # An SVG can carry script; if one is ever stored here, the browser must not run it
    <FilesMatch "(?i)\.svgz?$">
        Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox"
        Header always set Content-Disposition "attachment"
    </FilesMatch>
    php_admin_flag engine off
</DirectoryMatch>
