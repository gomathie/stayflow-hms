ServerTokens Prod
ServerSignature Off
# Trust X-Forwarded-* from the reverse proxy on the compose network
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>
ServerName localhost
